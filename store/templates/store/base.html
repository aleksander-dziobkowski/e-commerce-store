<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>{% block title %}CV{% endblock %}</title>
    <link rel="shortcut icon" href="{% static 'store/images/logo.svg' %}" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'store/css/app.css' %}"></link> 
    {% block css_style %} {% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">
    
    {% include "store/includes/navbar.html" %}

    <main class="flex-grow-1">{% block content %} {% endblock %}</main>
    
    {% include "store/includes/footer.html" %}

    <script src="{% static 'store/js/base.js' %}"></script>
    {% block js_script %}{% endblock %}
</body>
</html>
